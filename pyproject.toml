[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-topology-alignment"
version = "0.1.0"
description = "Feature topology alignment for multimodal traffic risk prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scikit-learn==1.7.2", "scipy>=1.11,<2"]

[project.optional-dependencies]
tabpfn = ["torch>=2.2", "tabpfn==6.0.6"]
modern = ["torch>=2.2", "rtdl-revisiting-models==0.0.2", "tabm==0.0.3", "tabicl==2.2.0"]
carte = ["carte-ai==0.0.26", "Pillow>=10"]
boosting = ["xgboost>=2,<4", "lightgbm>=4,<5", "catboost>=1.2,<2"]
plots = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
fta = "fta.cli:main"

[tool.setuptools.packages.find]
include = ["fta*"]

[tool.setuptools.data-files]
"share/feature-topology-alignment/results/reported" = ["results/reported/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
